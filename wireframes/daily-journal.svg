<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" lang="ko" role="img" aria-labelledby="title desc" font-family="-apple-system,system-ui,sans-serif" fill="#fff" stroke="#000" stroke-width="1.5">
<!-- 768 × 1024 -->


<title id="title">날짜별 일지</title><desc id="desc">달력에서 11월 26일을 눌러 연 화면. 기존 메모를 수정해 저장하거나 달력으로 돌아갈 수 있다.</desc>
<rect x="0" y="0" width="768" height="1024" rx="4" fill="#fff"/>
<text x="24" y="48" font-size="20" font-weight="600" text-anchor="start" fill="#000" stroke="none">‹  달력으로</text>
<path d="M24 72H744" fill="none" stroke="#e6e6e6"/>
<text x="24" y="136" font-size="28" font-weight="650" text-anchor="start" fill="#000" stroke="none">11월 26일 목요일</text>
<text x="24" y="192" font-size="14" font-weight="400" text-anchor="start" fill="#666" stroke="none">전체 계좌 일일 손익</text>
<text x="24" y="232" font-size="28" font-weight="650" text-anchor="start" fill="#000" stroke="none">+6,000원</text>
<path d="M24 264H744" fill="none" stroke="#e6e6e6"/>
<text x="24" y="320" font-size="20" font-weight="650" text-anchor="start" fill="#000" stroke="none">일일 일지</text>
<rect x="24" y="344" width="720" height="232" rx="4" fill="#fff"/>
<text x="48" y="384" font-size="14" font-weight="400" text-anchor="start" fill="#000" stroke="none">오후에는 추가 매수 없이 보유 종목의 움직임을 지켜봤다.</text>
<rect x="632" y="600" width="112" height="48" rx="4" fill="#000"/>
<text x="688" y="632" font-size="14" font-weight="650" text-anchor="middle" fill="#fff" stroke="none">저장</text>
</svg>
