<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" lang="ko" role="img" aria-labelledby="title desc" font-family="Malgun Gothic, sans-serif">
<title id="title">연구 후보에 팩터 추가</title><desc id="desc">1분봉 자료로 계산할 두 팩터를 선택한 예시. 호가 이력이 필요한 항목은 선택할 수 없다.</desc>
<rect x="0" y="0" width="768" height="1024" rx="0" fill="white" stroke="none"/>
<text x="32" y="42" font-size="21" fill="#222" font-weight="700">StockPilot</text>
<text x="540" y="41" font-size="15" fill="#222" font-weight="400">전략·운용  /  연구·백테스트</text>
<path d="M32 62H736" stroke="#ccc"/>
<text x="32" y="104" font-size="16" fill="#222" font-weight="400">‹  팩터와 매매 조건</text>
<text x="32" y="163" font-size="34" fill="#222" font-weight="700">팩터 추가</text>
<text x="32" y="204" font-size="16" fill="#222" font-weight="400">일반 전략 후보  ·  확정 1분봉  ·  사용 자료: 시가·고가·저가·종가·거래량</text>
<rect x="32" y="240" width="704" height="52" rx="5" fill="#fff" stroke="#999"/>
<text x="52" y="273" font-size="17" fill="#666" font-weight="400">이름 또는 팩터 키로 검색</text>
<rect x="32" y="310" width="82" height="40" rx="5" fill="#292929" stroke="#292929"/>
<text x="51" y="336" font-size="16" fill="#fff" font-weight="600">전체</text>
<rect x="124" y="310" width="120" height="40" rx="5" fill="#fff" stroke="#bbb"/>
<text x="143" y="336" font-size="16" fill="#333" font-weight="600">공개 구현</text>
<rect x="254" y="310" width="120" height="40" rx="5" fill="#fff" stroke="#bbb"/>
<text x="273" y="336" font-size="16" fill="#333" font-weight="600">맞춤 팩터</text>
<text x="32" y="404" font-size="20" fill="#222" font-weight="700">이 후보에서 선택 가능</text>
<path d="M32 423H736" stroke="#ccc"/>
<rect x="36" y="449" width="22" height="22" rx="3" fill="#242424" stroke="#555"/>
<path d="m40 460 5 5 10 -12" fill="none" stroke="white" stroke-width="2.5"/>
<text x="78" y="463" font-size="20" fill="#222" font-weight="650">상대강도지수 (RSI)</text>
<text x="78" y="492" font-size="15" fill="#555" font-weight="400">TA-Lib  ·  ta.rsi  ·  종가  ·  기간 14봉</text>
<path d="M32 511H736" stroke="#ccc"/>
<rect x="36" y="537" width="22" height="22" rx="3" fill="#242424" stroke="#555"/>
<path d="m40 548 5 5 10 -12" fill="none" stroke="white" stroke-width="2.5"/>
<text x="78" y="551" font-size="20" fill="#222" font-weight="650">삼중 지수이동평균 (TEMA)</text>
<text x="78" y="580" font-size="15" fill="#555" font-weight="400">TA-Lib  ·  ta.tema  ·  종가  ·  기간 9봉</text>
<path d="M32 599H736" stroke="#ccc"/>
<rect x="36" y="625" width="22" height="22" rx="3" fill="#fff" stroke="#555"/>
<text x="78" y="639" font-size="20" fill="#222" font-weight="650">평균 거래량 / 현재 거래량</text>
<text x="78" y="668" font-size="15" fill="#555" font-weight="400">Qlib Alpha158  ·  qlib.vma_ratio  ·  거래량</text>
<path d="M32 687H736" stroke="#ccc"/>
<text x="32" y="751" font-size="20" fill="#222" font-weight="700">추가 자료가 필요한 팩터</text>
<rect x="32" y="771" width="704" height="80" rx="4" fill="#f5f5f5" stroke="#ddd"/>
<text x="52" y="802" font-size="18" fill="#555" font-weight="650">최우선 호가 스프레드</text>
<text x="52" y="831" font-size="15" fill="#555" font-weight="400">맞춤 팩터  ·  매수·매도 1호가 이력이 필요합니다.</text>
<path d="M32 909H736" stroke="#ccc"/>
<text x="32" y="950" font-size="19" fill="#222" font-weight="700">2개 선택</text>
<text x="32" y="978" font-size="15" fill="#555" font-weight="400">RSI  ·  TEMA</text>
<rect x="540" y="930" width="196" height="56" rx="5" fill="#242424" stroke="none"/>
<text x="572" y="965" font-size="20" fill="white" font-weight="700">팩터 2개 추가</text>
</svg>
